<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            My Web page
        </title>
        <link rel="stylesheet" href="nesting.css">
    </head>
    <body>
        Hello, world!
        <div>
            <p>This is a paragraph inside the div</p>
            List inside the div:
            <ul>
                <li>item one</li>
                <li>item two</li>
            </ul>
        </div>
        <p>This is a paragraph outside the div</p>
        List outside the div:
        <ul>
            <li>item one</li>
            <li>item two</li>
        </ul>

    </body>
</html>
<!-- compile in terminal using: sass nesting.scss:nesting.css -->
